# multica-squad-kit-managed
# エージェント用の設定。人の Codex のプラグイン、MCP、notify と切り離す。
# ログイン時の個人の設定を読まず、プロジェクトのシェルの起動ファイルを使う。
# zsh は ZDOTDIR の .zshenv、bash は BASH_ENV を読む。
allow_login_shell = false
# 無人の実行で、起動のたびの更新の確認と、利用のデータの送信を止める。
check_for_update_on_startup = false

[analytics]
enabled = false

# 役に渡すフックの信頼。セットアップが hooks/list の値を埋める。
{{HOOKS_STATE}}
